# Virtual host inicial HTTP para o Nginx já existente na VPS.
# Configurar TLS pelo mecanismo ACME existente antes de considerar publicado.
# Válido para proxy executado no host (ou usando network_mode: host).
server {
    listen 80;
    server_name apphomologacao.traxup.com.br;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
