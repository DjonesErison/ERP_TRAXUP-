name: TRAXUP - diagnostico SMTP
on:
  push:
    branches: [fix/trial-mail-diagnostics]
permissions:
  contents: read
jobs:
  smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    env:
      SSH_HOST: ${{ secrets.HOMOLOGACAO_SSH_HOST }}
      SSH_USER: ${{ secrets.HOMOLOGACAO_SSH_USER }}
      SSH_PORT: ${{ secrets.HOMOLOGACAO_SSH_PORT }}
    steps:
      - name: Preparar acesso
        env:
          SSH_KEY: ${{ secrets.HOMOLOGACAO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOMOLOGACAO_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/homologacao
          chmod 600 ~/.ssh/homologacao
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Consultar status limitado do e-mail de teste autorizado
        run: |
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/homologacao "$SSH_USER@$SSH_HOST" 'bash -s' <<'SH'
          set -Eeuo pipefail
          docker exec traxup-homologacao-postgres-1 psql -U traxup_homologacao -d traxup_homologacao -c "SELECT status,attempts,last_error FROM trial_activation_emails WHERE trial_id='96b95718-1012-4132-a28c-a518cbbaf293'"
          SH
