name: TRAXUP - diagnostico limitado onboarding
on:
  push:
    branches: [fix/trial-mail-diagnostics]
permissions:
  contents: read
jobs:
  smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    env:
      SSH_HOST: ${{ secrets.HOMOLOGACAO_SSH_HOST }}
      SSH_USER: ${{ secrets.HOMOLOGACAO_SSH_USER }}
      SSH_PORT: ${{ secrets.HOMOLOGACAO_SSH_PORT }}
    steps:
      - name: Preparar acesso
        env:
          SSH_KEY: ${{ secrets.HOMOLOGACAO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOMOLOGACAO_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/homologacao
          chmod 600 ~/.ssh/homologacao
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Consultar somente causa tecnica do onboarding autorizado
        run: |
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/homologacao "$SSH_USER@$SSH_HOST" 'bash -s' <<'SH'
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess,re,json
          result=subprocess.run(['docker','logs','--since','45m','--tail','5000','traxup-homologacao-backend-1'],capture_output=True,text=True)
          logs=result.stdout+result.stderr
          blocks=re.split(r'(?=\d{4}-\d\d-\d\dT[^\n]* (?:ERROR|WARN) )',logs)
          found=[]
          for block in blocks:
              if 'OnboardingService.concluir' not in block: continue
              classes=sorted(set(re.findall(r'([a-zA-Z][\w.]+(?:Exception|Error))(?=[:\s])',block)))
              causes=[]
              for pattern in [r'null value in column "([a-z_]+)"',r'violates foreign key constraint "([a-z_]+)"',r'violates unique constraint "([a-z_]+)"',r'column "([a-z_]+)" does not exist',r'SQLState: ([0-9A-Z]{5})',r'could not initialize proxy',r'No value present']:
                  causes+=re.findall(pattern,block)
              found.append({'classes':classes,'causes':causes})
          print(json.dumps({'onboarding_errors':found[-3:]},ensure_ascii=True))
          PY
          SH
