name: TPlug ERP Backend - CI

on:
  push:
    branches:
      - develop
    paths:
      - 'tplug-erp/backend/**'
      - '.github/workflows/tplug-erp-backend-ci.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'tplug-erp/backend/**'
      - '.github/workflows/tplug-erp-backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Testes Backend Java 21 + PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tplug_erp
          POSTGRES_USER: tplug_erp
          POSTGRES_PASSWORD: tplug_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tplug_erp -d tplug_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/tplug_erp
      DB_USERNAME: tplug_erp
      DB_PASSWORD: tplug_erp_ci

    defaults:
      run:
        working-directory: tplug-erp/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tplug-erp/backend/pom.xml

      - name: Executar testes e validar migrations
        run: bash mvnw --batch-mode --no-transfer-progress clean verify
