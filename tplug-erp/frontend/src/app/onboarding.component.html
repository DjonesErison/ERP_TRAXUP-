<section class="onboarding"><div class="card"><img src="assets/traxup-logo.webp" alt="TRAXUP"><p class="eyebrow">Configuração inicial</p><h1>Vamos preparar sua empresa</h1><p>Sua conta e empresa já foram criadas. Confirme agora sua primeira unidade para começar a usar o ERP.</p><div class="progress"><b>1</b><span>Conta</span><b>2</b><span>Empresa</span><b class="active">3</b><span>Filial</span></div><div class="alert" *ngIf="error">{{error}}</div><form (ngSubmit)="finalizar()"><label>Nome da primeira unidade<input name="nomeFilial" [(ngModel)]="nomeFilial" required maxlength="200"></label><label>CNPJ da unidade <small>(se aplicável)</small><input name="cnpj" [(ngModel)]="cnpj" maxlength="18"></label><button type="submit" [disabled]="loading||!nomeFilial.trim()">{{loading?'Configurando...':'Concluir e entrar no ERP →'}}</button></form></div></section>
