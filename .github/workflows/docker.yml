name: TRAXUP Central - Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build e Publicação Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar metadados públicos do build
        run: |
          mkdir -p public
          cat > public/build-info.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "commitShort": "${GITHUB_SHA::8}",
            "branch": "${GITHUB_REF_NAME}",
            "repository": "${GITHUB_REPOSITORY}",
            "runId": "${GITHUB_RUN_ID}",
            "runNumber": "${GITHUB_RUN_NUMBER}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/djoneserison/traxup-central:latest
            ghcr.io/djoneserison/traxup-central:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
