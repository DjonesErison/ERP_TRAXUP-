name: TPlug ERP Frontend - CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'tplug-erp/frontend/**'
      - '.github/workflows/tplug-erp-frontend-ci.yml'
  push:
    branches: [develop]
    paths:
      - 'tplug-erp/frontend/**'
      - '.github/workflows/tplug-erp-frontend-ci.yml'

jobs:
  build:
    name: Build Angular 19
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tplug-erp/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tplug-erp/frontend/package.json
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Build de producao
        run: npm run build
