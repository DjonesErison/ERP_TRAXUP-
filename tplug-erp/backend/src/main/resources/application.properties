spring.application.name=tplug-erp-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tplug_erp}
spring.datasource.username=${DB_USERNAME:tplug_erp}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:traxup-tplug-erp}
security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:30}

bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.tenant-name=${BOOTSTRAP_ADMIN_TENANT_NAME:}
bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${SERVER_PORT:8080}

fiscal.storage.enabled=${FISCAL_STORAGE_ENABLED:false}
fiscal.storage.bucket=${FISCAL_STORAGE_BUCKET:}
fiscal.storage.region=${FISCAL_STORAGE_REGION:us-east-1}
fiscal.storage.endpoint=${FISCAL_STORAGE_ENDPOINT:}
fiscal.storage.path-style=${FISCAL_STORAGE_PATH_STYLE:true}

fiscal.storage.worker.initial-delay-ms=${FISCAL_STORAGE_WORKER_INITIAL_DELAY_MS:30000}
fiscal.storage.worker.delay-ms=${FISCAL_STORAGE_WORKER_DELAY_MS:60000}
fiscal.storage.worker.tenant-batch=${FISCAL_STORAGE_WORKER_TENANT_BATCH:50}
fiscal.storage.worker.item-batch=${FISCAL_STORAGE_WORKER_ITEM_BATCH:10}
