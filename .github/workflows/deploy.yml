name: TRAXUP Central - Deploy

on:
  workflow_run:
    workflows:
      - TRAXUP Central - Docker
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: traxup-central-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy produção
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout do commit publicado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TRAXUP_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.TRAXUP_DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.TRAXUP_DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/traxup_deploy
          chmod 600 ~/.ssh/traxup_deploy
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Enviar script de deploy
        env:
          SSH_HOST: ${{ secrets.TRAXUP_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.TRAXUP_DEPLOY_USER }}
          SSH_PORT: ${{ secrets.TRAXUP_DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          PORT="${SSH_PORT:-22}"
          scp -P "$PORT" -i ~/.ssh/traxup_deploy deploy/deploy-central.sh "$SSH_USER@$SSH_HOST:/tmp/traxup-deploy-central.sh"

      - name: Executar deploy e health checks
        env:
          SSH_HOST: ${{ secrets.TRAXUP_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.TRAXUP_DEPLOY_USER }}
          SSH_PORT: ${{ secrets.TRAXUP_DEPLOY_PORT }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/traxup_deploy "$SSH_USER@$SSH_HOST" \
            "chmod +x /tmp/traxup-deploy-central.sh && TRAXUP_CENTRAL_IMAGE=ghcr.io/djoneserison/traxup-central:${IMAGE_SHA} /tmp/traxup-deploy-central.sh"
