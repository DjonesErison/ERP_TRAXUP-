spring.application.name=tplug-erp-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tplug_erp}
spring.datasource.username=${DB_USERNAME:tplug_erp}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:traxup-tplug-erp}
security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:30}

server.port=${SERVER_PORT:8080}
