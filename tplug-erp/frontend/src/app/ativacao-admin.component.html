<section class="activation"><div class="card"><img src="assets/traxup-logo.webp" alt="TRAXUP"><p class="eyebrow">Primeiro acesso</p><h1>Crie sua senha</h1><p>Seu cadastro foi concluído. Defina agora a senha do administrador para continuar a configuração da empresa.</p><div class="alert" *ngIf="error">{{error}}</div><form (ngSubmit)="ativar()"><label>Nova senha<input name="senha" type="password" [(ngModel)]="senha" minlength="8" maxlength="72" required autocomplete="new-password"></label><label>Confirme a senha<input name="confirmacao" type="password" [(ngModel)]="confirmacao" minlength="8" maxlength="72" required autocomplete="new-password"></label><small *ngIf="senha && senha.length<8">Use pelo menos 8 caracteres.</small><small *ngIf="confirmacao && senha!==confirmacao">As senhas precisam ser iguais.</small><button type="submit" [disabled]="loading||senha.length<8||senha!==confirmacao">{{loading?'Ativando...':'Criar senha e continuar →'}}</button></form><app-reenviar-ativacao *ngIf="error" [codigoEmpresa]="codigoEmpresa" [email]="email" /></div></section>
